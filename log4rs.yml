appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{d} - {l} - {f}:{L} - {m}{n}"
  file:
    kind: rolling_file
    path: "log/app.log"
    encoder:
      pattern: "{d} - {l} - {f}:{L} - {m}{n}"
    policy:
      trigger:
        kind: size
        limit: 100 mb
      roller:
        kind: delete
root:
  level: info
  appenders:
    - stdout
    - file