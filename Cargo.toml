[package]
name = "v2ray_geoip"
version = "0.1.0"
edition = "2024"

[dependencies]
ping = { version = "0.9.0" , features = ["tokio"]}
tokio = { version = "1.8", features = ["rt-multi-thread", "macros"] }
log = "0.4"
pretty_env_logger = "0.5"
serde = { version = "1.0.229" , features = ["derive"]}
config = "0.15.25"
clokwerk = { version = "0.4.0" , features = ["async"]}
log4rs = "1.4.0"
axum = { version = "0.8.9", features = ["macros"]}
reqwest = { version = "0.13.5", features = ["json"]}
regex = "1.13.1"
tokio-stream = "0.1.19"
futures = "0.3.34"
tokio-rusqlite = { version = "0.8.0" ,features = ["bundled", "chrono"]}
dns-lookup = "4.0.1"
proptest = "1.11.0"
rand = "0.9.5"
base64 = "0.23.1"
serde_json = "1.0.151"

